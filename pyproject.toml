[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scholarly-graph"
version = "0.1.0"
description = "Scholarly Graph: network-aware RAG over inequality-mobility literature"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0.0",
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "neo4j>=5.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pdfplumber>=0.11.0",
    "pymupdf>=1.23.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "python-dotenv>=1.0.0",
    "qdrant-client>=1.9.0",
    "structlog>=24.0.0",
    "tenacity>=8.0.0",
    "uvicorn>=0.29.0",
]

[tool.hatch.build.targets.wheel]
packages = [
    "Ingestion_Pipline",
    "Retrival_Pipline",
    "scholarly_graph"
]

[tool.pytest.ini_options]
pythonpath = [
    "."
]
testpaths = ["tests"]
